<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashFlyer | FlashTools</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:wght@700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0A0E27; --bg2:#111827; --surface:#1E293B;
      --cyan:#06B6D4; --violet:#8B5CF6;
      --text:#F1F5F9; --text2:#94A3B8;
      --border:#334155; --grad:linear-gradient(135deg,#06B6D4,#8B5CF6);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

    .header{text-align:center;padding:34px 20px 22px;border-bottom:1px solid var(--border);}
    .header h1{font-family:'Syne',sans-serif;font-size:clamp(1.7em,5vw,2.5em);font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .header p{color:var(--text2);margin-top:6px;font-size:.92em;}

    .app-layout{display:grid;grid-template-columns:360px 1fr;max-width:1340px;margin:0 auto;min-height:calc(100vh - 112px);}

    .controls{background:var(--bg2);border-right:1px solid var(--border);padding:20px;overflow-y:auto;max-height:calc(100vh - 112px);}
    .sec{font-size:.67em;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin:20px 0 10px;}
    .sec:first-child{margin-top:0;}

    .fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .fmt-btn{padding:9px 7px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text2);cursor:pointer;font-size:.8em;font-weight:500;text-align:center;transition:all .2s;line-height:1.3;}
    .fmt-btn span{display:block;font-size:.72em;opacity:.55;margin-top:2px;}
    .fmt-btn:hover{border-color:var(--cyan);color:var(--text);}
    .fmt-btn.active{border-color:var(--cyan);background:rgba(6,182,212,.12);color:var(--cyan);}
    .fmt-btn.active span{color:var(--cyan);}

    .themes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
    .theme-btn{border:2px solid transparent;border-radius:9px;cursor:pointer;overflow:hidden;transition:all .2s;aspect-ratio:1;position:relative;}
    .theme-btn:hover{transform:scale(1.05);}
    .theme-btn.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan);}
    .theme-btn canvas{width:100%;height:100%;display:block;}
    .theme-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);font-size:.58em;text-align:center;padding:3px 2px;color:#fff;font-weight:500;}
    .theme-tag{display:inline-block;font-size:.9em;padding:1px 4px;border-radius:3px;margin-top:1px;font-weight:600;}
    .tag-screen{background:rgba(6,182,212,.3);color:#06B6D4;}
    .tag-print{background:rgba(16,185,129,.3);color:#10B981;}
    .tag-both{background:rgba(139,92,246,.3);color:#8B5CF6;}

    .tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
    .tpl-thumb{border:2px solid transparent;border-radius:8px;cursor:pointer;overflow:hidden;transition:all .2s;aspect-ratio:1;}
    .tpl-thumb:hover{transform:scale(1.04);}
    .tpl-thumb.active{border-color:var(--cyan);}
    .tpl-thumb canvas{width:100%;height:100%;display:block;}

    .field{margin-bottom:11px;}
    .field label{display:block;font-size:.77em;color:var(--text2);margin-bottom:4px;font-weight:500;}
    .field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 11px;font-size:.87em;font-family:'DM Sans',sans-serif;transition:border-color .2s;outline:none;resize:none;}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);}
    .field textarea{height:54px;}
    .field select option{background:var(--surface);}

    /* SLIDER GÉNÉRIQUE */
    .slider-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
    .slider-row label{font-size:.77em;color:var(--text2);font-weight:500;min-width:110px;}
    .slider-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;background:var(--border);height:5px;border-radius:3px;outline:none;}
    .slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--grad);cursor:pointer;}
    .slider-row input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--cyan);cursor:pointer;border:none;}
    .slider-val{font-size:.77em;color:var(--cyan);font-weight:600;min-width:30px;text-align:right;}

    /* ACCENT */
    .accent-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
    .accent-row label{font-size:.77em;color:var(--text2);font-weight:500;flex:1;}
    .accent-row input[type=color]{width:38px;height:28px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:none;padding:2px;}
    .accent-hint{font-size:.7em;color:var(--text2);opacity:.6;margin-bottom:11px;font-style:italic;}

    /* IMAGE */
    .img-upload{border:1.5px dashed var(--border);border-radius:9px;padding:14px;text-align:center;cursor:pointer;background:rgba(6,182,212,.03);transition:all .2s;margin-bottom:10px;font-size:.82em;color:var(--text2);}
    .img-upload:hover{border-color:var(--cyan);color:var(--text);}
    .img-upload input{display:none;}
    .img-loaded{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.3);border-radius:8px;margin-bottom:10px;font-size:.8em;color:var(--cyan);}
    .img-loaded button{margin-left:auto;background:none;border:none;color:var(--text2);cursor:pointer;font-size:1em;padding:0 2px;}
    .img-loaded button:hover{color:#ef4444;}

    /* EXPORTS */
    .export-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px;}
    .btn-exp{padding:10px 7px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text);font-size:.8em;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;line-height:1.35;}
    .btn-exp small{display:block;font-size:.82em;color:var(--text2);font-weight:400;margin-top:1px;}
    .btn-exp:hover{border-color:var(--cyan);background:rgba(6,182,212,.07);}
    .btn-exp.print{border-color:rgba(16,185,129,.35);color:#10B981;}
    .btn-exp.print:hover{background:rgba(16,185,129,.07);}
    .btn-web{width:100%;padding:12px;border:none;border-radius:10px;background:var(--grad);color:#fff;font-size:.88em;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:opacity .2s,transform .15s;}
    .btn-web:hover{opacity:.9;transform:translateY(-1px);}

    .preview-area{display:flex;align-items:center;justify-content:center;padding:32px 24px;background:#060912;}
    #previewCanvas{display:block;max-width:100%;max-height:calc(100vh - 180px);border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);}

    @media(max-width:860px){
      .app-layout{grid-template-columns:1fr;}
      .controls{max-height:none;border-right:none;border-bottom:1px solid var(--border);}
      .preview-area{padding:18px 12px;}
      #previewCanvas{max-height:58vw;}
    }
    @media(max-width:480px){
      .header{padding:22px 14px 16px;}
      .controls{padding:14px;}
    }
  </style>
</head>
<body>

<div class="header">
  <h1>FlashFlyer</h1>
  <p>Créez des visuels percutants en quelques secondes</p>
</div>

<div class="app-layout">
<div class="controls">

  <div class="sec">Format</div>
  <div class="fmt-grid">
    <button class="fmt-btn active" onclick="setFormat('square',this)">Carré<span>1080 × 1080</span></button>
    <button class="fmt-btn" onclick="setFormat('portrait',this)">Portrait A4<span>2480 × 3508</span></button>
    <button class="fmt-btn" onclick="setFormat('story',this)">Story<span>1080 × 1920</span></button>
    <button class="fmt-btn" onclick="setFormat('landscape',this)">Paysage<span>1920 × 1080</span></button>
  </div>

  <div class="sec">Thème</div>
  <div class="themes-grid" id="themesGrid"></div>

  <div class="sec">Template</div>
  <div class="tpl-grid" id="tplGrid"></div>

  <div class="sec">Personnalisation</div>

  <div class="accent-row">
    <label>Couleur d'accent</label>
    <input type="color" id="accentPicker" oninput="onAccentChange()">
  </div>
  <p class="accent-hint">Les autres couleurs s'adaptent automatiquement.</p>

  <div class="slider-row">
    <label>Intensité du fond</label>
    <input type="range" id="bgDarken" min="-60" max="60" value="0" oninput="onBgDarken(this)">
    <span class="slider-val" id="bgDarkenVal">0</span>
  </div>

  <div class="sec">Image de fond</div>
  <div class="img-upload" id="imgUploadZone" onclick="document.getElementById('bgImgInput').click()">
    Cliquer pour ajouter une image de fond
    <input type="file" id="bgImgInput" accept="image/*" onchange="loadBgImage(this)">
  </div>
  <div class="img-loaded" id="imgLoadedRow" style="display:none">
    <span id="imgFileName">image.jpg</span>
    <button onclick="removeBgImage()" title="Supprimer">✕</button>
  </div>

  <div class="slider-row" id="opacityRow" style="display:none">
    <label>Opacité image</label>
    <input type="range" id="bgOpacity" min="0" max="100" value="35" oninput="onBgOpacity(this)">
    <span class="slider-val" id="bgOpacityVal">35%</span>
  </div>

  <div class="slider-row" id="edgeRow" style="display:none">
    <label>Renforcement contours</label>
    <input type="range" id="edgeStrength" min="0" max="100" value="0" oninput="onEdgeStrength(this)">
    <span class="slider-val" id="edgeStrengthVal">0</span>
  </div>

  <div class="sec">Contenu</div>
  <div class="field"><label>Titre principal</label><input type="text" id="fTitle" value="SOLDES D'ÉTÉ" oninput="render()"></div>
  <div class="field"><label>Sous-titre</label><input type="text" id="fSub" value="Jusqu'à -50% sur toute la collection" oninput="render()"></div>
  <div class="field"><label>Corps du texte</label><textarea id="fBody" oninput="render()">Du 15 au 31 juillet
Venez profiter de nos offres exceptionnelles</textarea></div>
  <div class="field"><label>Appel à l'action</label><input type="text" id="fCta" value="Découvrir les offres" oninput="render()"></div>
  <div class="field"><label>Nom / marque</label><input type="text" id="fBrand" value="Ma Boutique" oninput="render()"></div>
  <div class="field"><label>Lien bouton (export web)</label><input type="text" id="fUrl" value="https://monsite.fr" oninput="render()"></div>

  <div class="sec">Export</div>
  <div class="export-grid">
    <button class="btn-exp" onclick="exportImg('png')">PNG HD<small>Écran / Web</small></button>
    <button class="btn-exp" onclick="exportImg('jpg')">JPG<small>Réseaux sociaux</small></button>
    <button class="btn-exp print" onclick="exportPrint()">PNG 300 DPI<small>Impression A4</small></button>
    <button class="btn-exp print" onclick="exportImg('png')">PNG HD<small>Impression</small></button>
  </div>
  <button class="btn-web" onclick="exportHtml()">Exporter page web avec bouton cliquable</button>

</div>
<div class="preview-area">
  <canvas id="previewCanvas"></canvas>
</div>
</div>

<script>
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');

// ── FORMATS ──────────────────────────────────────────────
const FORMATS = {
  square:   {w:1080,h:1080},
  portrait: {w:2480,h:3508},
  story:    {w:1080,h:1920},
  landscape:{w:1920,h:1080}
};
let currentFormat = 'square';

// ── THÈMES ────────────────────────────────────────────────
const THEMES = [
  {name:'Minuit',  tag:'both',  bg:'#0A0E27',bg2:'#1E293B',accent:'#06B6D4',text:'#F1F5F9',muted:'#94A3B8',font:"'Syne',sans-serif"},
  {name:'Luxe',    tag:'both',  bg:'#18100A',bg2:'#2A1A0A',accent:'#D4AF37',text:'#FAF3E0',muted:'#C4A882',font:"'Playfair Display',serif"},
  {name:'Soleil',  tag:'screen',bg:'#FFF8E1',bg2:'#FFF3CD',accent:'#F59E0B',text:'#1C1A00',muted:'#6B5E00',font:"'Space Grotesk',sans-serif"},
  {name:'Forêt',   tag:'print', bg:'#0D1F12',bg2:'#162A1B',accent:'#10B981',text:'#ECFDF5',muted:'#86EFAC',font:"'DM Sans',sans-serif"},
  {name:'Feu',     tag:'screen',bg:'#1A0800',bg2:'#2D1000',accent:'#EF4444',text:'#FFF5F0',muted:'#FCA5A5',font:"'Syne',sans-serif"},
  {name:'Glace',   tag:'screen',bg:'#EFF6FF',bg2:'#DBEAFE',accent:'#2563EB',text:'#1E3A5F',muted:'#3B82F6',font:"'Space Grotesk',sans-serif"},
  {name:'Encre',   tag:'print', bg:'#FAFAFA',bg2:'#F1F5F9',accent:'#0F172A',text:'#0F172A',muted:'#475569',font:"'Playfair Display',serif"},
  {name:'Violet',  tag:'both',  bg:'#1A0A2E',bg2:'#2D1A4E',accent:'#8B5CF6',text:'#FAF5FF',muted:'#C4B5FD',font:"'Syne',sans-serif"},
];
let currentThemeIdx = 0;
let accentOverride = null;
let bgDarkenVal = 0;

// Correction chromatique auto sur changement d'accent
function deriveThemeFromAccent(baseTheme, newAccent) {
  const lum = luminance(newAccent);
  const isDarkBg = luminance(baseTheme.bg) < 0.3;
  // Texte sur bouton : blanc si accent sombre, noir si accent clair
  const btnText = lum > 0.45 ? '#0F172A' : '#FFFFFF';
  // Muted : version désaturée/atténuée de l'accent
  const mutedCol = isDarkBg ? mixColors(newAccent, baseTheme.bg, 0.45) : mixColors(newAccent, '#FFFFFF', 0.55);
  return { ...baseTheme, accent: newAccent, muted: mutedCol, _btnText: btnText };
}

function getTheme() {
  let t = { ...THEMES[currentThemeIdx] };
  if (accentOverride) t = deriveThemeFromAccent(t, accentOverride);
  // Appliquer intensité fond
  if (bgDarkenVal !== 0) {
    t.bg  = shadeHex(t.bg,  bgDarkenVal);
    t.bg2 = shadeHex(t.bg2, bgDarkenVal);
  }
  return t;
}

// ── IMAGE DE FOND ─────────────────────────────────────────
let bgImage = null;
let bgOpacity = 0.35;
let edgeStrength = 0;
let bgImageProcessed = null; // cache image avec contours

function loadBgImage(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      bgImage = img;
      bgImageProcessed = null;
      document.getElementById('imgUploadZone').style.display = 'none';
      document.getElementById('imgLoadedRow').style.display = 'flex';
      document.getElementById('imgFileName').textContent = file.name.length > 24 ? file.name.slice(0,22)+'…' : file.name;
      document.getElementById('opacityRow').style.display = 'flex';
      document.getElementById('edgeRow').style.display = 'flex';
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeBgImage() {
  bgImage = null; bgImageProcessed = null;
  document.getElementById('bgImgInput').value = '';
  document.getElementById('imgUploadZone').style.display = 'block';
  document.getElementById('imgLoadedRow').style.display = 'none';
  document.getElementById('opacityRow').style.display = 'none';
  document.getElementById('edgeRow').style.display = 'none';
  render();
}

function onBgOpacity(el) {
  bgOpacity = el.value / 100;
  document.getElementById('bgOpacityVal').textContent = el.value + '%';
  render();
}

function onEdgeStrength(el) {
  edgeStrength = el.value / 100;
  bgImageProcessed = null; // invalider cache
  document.getElementById('edgeStrengthVal').textContent = el.value;
  render();
}

// Applique filtre de renforcement de contours (Sobel simplifié)
function getProcessedBgImage(W, H) {
  if (!bgImage) return null;
  if (bgImageProcessed && bgImageProcessed.W === W && bgImageProcessed.H === H && bgImageProcessed.edge === edgeStrength) return bgImageProcessed.canvas;

  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(bgImage, 0, 0, W, H);

  if (edgeStrength > 0) {
    const imgData = tctx.getImageData(0, 0, W, H);
    const data = imgData.data;
    const orig = new Uint8ClampedArray(data);
    const str = edgeStrength * 2.5;
    for (let y = 1; y < H-1; y++) {
      for (let x = 1; x < W-1; x++) {
        for (let c = 0; c < 3; c++) {
          const idx = (y*W+x)*4+c;
          const center = orig[idx];
          const avg = (orig[((y-1)*W+x)*4+c]+orig[((y+1)*W+x)*4+c]+orig[(y*W+x-1)*4+c]+orig[(y*W+x+1)*4+c])/4;
          data[idx] = Math.max(0, Math.min(255, center + (center - avg) * str));
        }
      }
    }
    tctx.putImageData(imgData, 0, 0);
  }

  bgImageProcessed = { canvas: tmp, W, H, edge: edgeStrength };
  return tmp;
}

// Dessine l'image de fond avec opacité
function drawBgImage(c, W, H) {
  if (!bgImage) return;
  const processed = getProcessedBgImage(W, H);
  c.save();
  c.globalAlpha = bgOpacity;
  c.drawImage(processed, 0, 0, W, H);
  c.restore();
}

// ── TEMPLATES ─────────────────────────────────────────────
const TEMPLATES = [
  {
    name:'Néon',
    draw(c,W,H,d,t){
      fillBg(c,W,H,t.bg,t.bg2);
      drawBgImage(c,W,H);
      drawHalo(c,W*.85,H*.12,W*.38,t.accent,.12);
      c.fillStyle=t.accent; c.fillRect(W*.062,H*.2,W*.005,H*.58);
      c.fillStyle=t.text;
      drawTitle(c,d.title,W*.09,H*.28,W*.87,t.font,W*.092,H*.11,'left');
      c.fillStyle=t.accent; c.fillRect(W*.09,H*.44,W*.13,W*.004);
      c.fillStyle=t.accent;
      drawLine(c,d.sub,W*.09,H*.515,W*.86,`500 ${W*.034}px 'DM Sans',sans-serif`,'left');
      c.fillStyle=hexA(t.text,.68);
      drawMultiline(c,d.body,W*.09,H*.60,W*.82,`300 ${W*.026}px 'DM Sans',sans-serif`,W*.032,'left',3);
      drawBtn(c,d.cta,W*.09,H*.73,W*.52,H*.065,t.accent,t._btnText||'#fff',W*.029);
      c.fillStyle=hexA(t.text,.35);
      drawLine(c,d.brand,W*.94,H*.955,W*.45,`400 ${W*.021}px 'DM Sans',sans-serif`,'right');
    }
  },
  {
    name:'Géo',
    draw(c,W,H,d,t){
      c.fillStyle=t.bg; c.fillRect(0,0,W,H);
      drawBgImage(c,W,H);
      c.save(); c.globalAlpha=.15; c.fillStyle=t.accent;
      c.beginPath(); c.moveTo(W,0); c.lineTo(W,H*.52); c.lineTo(W*.42,0); c.closePath(); c.fill(); c.restore();
      c.fillStyle=t.accent; c.fillRect(0,H*.44,W,H*.11);
      c.fillStyle='#fff';
      drawTitle(c,d.title,W/2,H*.515,W*.88,t.font,W*.09,H*.1,'center');
      c.fillStyle=hexA(t.text,.82);
      drawMultiline(c,d.sub,W/2,H*.29,W*.8,`300 ${W*.035}px 'DM Sans',sans-serif`,W*.042,'center',2);
      c.fillStyle=hexA(t.text,.62);
      drawMultiline(c,d.body,W/2,H*.65,W*.78,`300 ${W*.026}px 'DM Sans',sans-serif`,W*.031,'center',3);
      c.fillStyle=t.text;
      drawLine(c,'→ '+d.cta,W/2,H*.82,W*.75,`700 ${W*.029}px 'DM Sans',sans-serif`,'center');
      c.fillStyle=hexA(t.text,.35);
      drawLine(c,d.brand,W/2,H*.955,W*.6,`400 ${W*.021}px 'DM Sans',sans-serif`,'center');
    }
  },
  {
    name:'Cadre',
    draw(c,W,H,d,t){
      c.fillStyle=t.bg; c.fillRect(0,0,W,H);
      drawBgImage(c,W,H);
      const m1=W*.04,m2=W*.056;
      c.strokeStyle=t.accent; c.lineWidth=W*.004; c.strokeRect(m1,m1,W-m1*2,H-m1*2);
      c.save(); c.globalAlpha=.32; c.lineWidth=W*.001; c.strokeRect(m2,m2,W-m2*2,H-m2*2); c.restore();
      c.save(); c.translate(W/2,H*.5); c.rotate(Math.PI/4); c.fillStyle=t.accent; c.fillRect(-W*.013,-W*.013,W*.026,W*.026); c.restore();
      c.strokeStyle=t.accent; c.lineWidth=W*.0015;
      c.beginPath(); c.moveTo(W*.2,H*.5); c.lineTo(W*.8,H*.5); c.stroke();
      c.fillStyle=t.text;
      drawTitle(c,d.title,W/2,H*.26,W*.82,t.font,W*.085,H*.1,'center');
      c.fillStyle=t.accent;
      drawLine(c,d.sub,W/2,H*.41,W*.78,`400 ${W*.031}px 'DM Sans',sans-serif`,'center');
      c.fillStyle=hexA(t.text,.68);
      drawMultiline(c,d.body,W/2,H*.62,W*.78,`300 ${W*.026}px 'DM Sans',sans-serif`,W*.031,'center',3);
      drawBtnOutline(c,d.cta,W/2,H*.76,W*.52,H*.068,t.accent,W*.027);
      c.fillStyle=hexA(t.text,.34);
      drawLine(c,d.brand,W/2,H*.925,W*.55,`400 ${W*.02}px 'DM Sans',sans-serif`,'center');
    }
  },
  {
    name:'Split',
    draw(c,W,H,d,t){
      c.fillStyle=t.bg; c.fillRect(0,0,W,H);
      c.fillStyle=t.accent; c.fillRect(0,0,W,H*.47);
      c.beginPath(); c.moveTo(0,H*.47); c.lineTo(W,H*.38); c.lineTo(W,H*.47); c.closePath(); c.fill();
      drawBgImage(c,W,H);
      c.fillStyle='#fff';
      drawTitle(c,d.title,W/2,H*.19,W*.86,t.font,W*.092,H*.11,'center');
      c.fillStyle='rgba(255,255,255,0.82)';
      drawLine(c,d.sub,W/2,H*.37,W*.82,`400 ${W*.033}px 'DM Sans',sans-serif`,'center');
      c.fillStyle=hexA(t.text,.72);
      drawMultiline(c,d.body,W/2,H*.58,W*.8,`300 ${W*.026}px 'DM Sans',sans-serif`,W*.031,'center',3);
      drawBtn(c,d.cta,(W-W*.52)/2,H*.72,W*.52,H*.068,t.text,t.bg,W*.027);
      c.fillStyle=hexA(t.text,.36);
      drawLine(c,d.brand,W/2,H*.955,W*.55,`400 ${W*.021}px 'DM Sans',sans-serif`,'center');
    }
  },
  {
    name:'Minimal',
    draw(c,W,H,d,t){
      const isDark=luminance(t.bg)<.3;
      const bg=isDark?'#F8FAFC':t.bg, txt=isDark?'#0F172A':t.text, muted=isDark?'#64748B':t.muted;
      c.fillStyle=bg; c.fillRect(0,0,W,H);
      drawBgImage(c,W,H);
      c.fillStyle=t.accent; c.fillRect(W*.08,H*.16,W*.005,H*.54);
      c.beginPath(); c.arc(W*.0825,H*.16,W*.011,0,Math.PI*2); c.fill();
      c.fillStyle=txt;
      drawTitle(c,d.title,W*.13,H*.28,W*.78,t.font,W*.085,H*.1,'left');
      c.fillStyle=t.accent; c.fillRect(W*.13,H*.43,W*.1,W*.004);
      c.fillStyle=txt;
      drawLine(c,d.sub,W*.13,H*.515,W*.8,`400 ${W*.032}px 'DM Sans',sans-serif`,'left');
      c.fillStyle=muted;
      drawMultiline(c,d.body,W*.13,H*.605,W*.78,`300 ${W*.026}px 'DM Sans',sans-serif`,W*.032,'left',3);
      c.fillStyle=t.accent;
      drawLine(c,'→ '+d.cta,W*.13,H*.775,W*.75,`700 ${W*.027}px 'DM Sans',sans-serif`,'left');
      c.fillStyle=muted; c.save(); c.globalAlpha=.58;
      drawLine(c,d.brand,W*.13,H*.935,W*.55,`400 ${W*.02}px 'DM Sans',sans-serif`,'left');
      c.restore();
    }
  }
];
let currentTplIdx = 0;

// ── HELPERS DESSIN ────────────────────────────────────────
function fillBg(c,W,H,col1,col2){
  const g=c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,col1); g.addColorStop(1,col2||shadeHex(col1,-20));
  c.fillStyle=g; c.fillRect(0,0,W,H);
}
function drawHalo(c,x,y,r,col,alpha){
  c.save(); c.globalAlpha=alpha;
  const g=c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col); g.addColorStop(1,'transparent');
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.restore();
}
function drawTitle(c,text,x,y,maxW,font,fontSize,maxH,align){
  if(!text)return;
  let size=fontSize; const min=fontSize*.42;
  c.textAlign=align;
  while(size>min){
    c.font=`800 ${size}px ${font}`;
    const lines=breakLines(c,text.toUpperCase(),maxW);
    if(lines.length<=2&&lines.length*size*1.15<=maxH)break;
    size*=.88;
  }
  c.font=`800 ${size}px ${font}`;
  const lines=breakLines(c,text.toUpperCase(),maxW);
  const lh=size*1.15;
  lines.slice(0,2).forEach((l,i)=>c.fillText(l,x,y+i*lh));
}
function drawLine(c,text,x,y,maxW,font,align){
  if(!text)return;
  c.font=font; c.textAlign=align;
  let t=text;
  while(c.measureText(t).width>maxW&&t.length>3)t=t.slice(0,-1);
  if(t!==text)t=t.slice(0,-1)+'…';
  c.fillText(t,x,y);
}
function drawMultiline(c,text,x,y,maxW,font,lineH,align,maxLines){
  if(!text)return;
  c.font=font; c.textAlign=align;
  let out=[];
  for(const raw of text.split('\n')){
    out=out.concat(breakLines(c,raw,maxW));
    if(out.length>=maxLines)break;
  }
  out.slice(0,maxLines).forEach((l,i)=>c.fillText(l,x,y+i*lineH));
}
function breakLines(c,text,maxW){
  const words=text.split(' '), lines=[];
  let line='';
  for(const w of words){
    const test=line+(line?' ':'')+w;
    if(c.measureText(test).width>maxW&&line){lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);
  return lines;
}
function drawBtn(c,text,x,y,maxW,h,bgCol,textCol,fontSize){
  if(!text)return;
  c.font=`700 ${fontSize}px 'DM Sans',sans-serif`;
  const tw=Math.min(c.measureText(text).width+maxW*.2,maxW);
  c.fillStyle=bgCol; rrect(c,x,y,tw,h,h*.44); c.fill();
  c.fillStyle=textCol; c.textAlign='center'; c.fillText(text,x+tw/2,y+h*.64);
}
function drawBtnOutline(c,text,cx,y,maxW,h,col,fontSize){
  if(!text)return;
  c.font=`600 ${fontSize}px 'DM Sans',sans-serif`;
  const tw=Math.min(c.measureText(text).width+maxW*.22,maxW);
  c.strokeStyle=col; c.lineWidth=2; rrect(c,cx-tw/2,y,tw,h,h*.44); c.stroke();
  c.fillStyle=col; c.textAlign='center'; c.fillText(text,cx,y+h*.64);
}
function rrect(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function shadeHex(hex,pct){
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.max(0,Math.min(255,(n>>16)+pct)),g=Math.max(0,Math.min(255,((n>>8)&255)+pct)),b=Math.max(0,Math.min(255,(n&255)+pct));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function luminance(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  return .2126*r+.7152*g+.0722*b;
}
function mixColors(hex1,hex2,t){
  const r1=parseInt(hex1.slice(1,3),16),g1=parseInt(hex1.slice(3,5),16),b1=parseInt(hex1.slice(5,7),16);
  const r2=parseInt(hex2.slice(1,3),16),g2=parseInt(hex2.slice(3,5),16),b2=parseInt(hex2.slice(5,7),16);
  const r=Math.round(r1+(r2-r1)*t),g=Math.round(g1+(g2-g1)*t),b=Math.round(b1+(b2-b1)*t);
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

// ── DATA ─────────────────────────────────────────────────
function getData(){
  return {
    title:v('fTitle')||'TITRE', sub:v('fSub')||'', body:v('fBody')||'',
    cta:v('fCta')||'', brand:v('fBrand')||'', url:v('fUrl')||'#'
  };
}
function v(id){return document.getElementById(id).value.trim();}

// ── RENDER ────────────────────────────────────────────────
function render(exportCanvas){
  const c=exportCanvas?exportCanvas.getContext('2d'):ctx;
  const cv=exportCanvas||canvas;
  const fmt=FORMATS[currentFormat];
  cv.width=fmt.w; cv.height=fmt.h;
  c.clearRect(0,0,fmt.w,fmt.h);
  TEMPLATES[currentTplIdx].draw(c,fmt.w,fmt.h,getData(),getTheme());
}

// ── CONTRÔLES ────────────────────────────────────────────
function setFormat(fmt,btn){
  currentFormat=fmt;
  document.querySelectorAll('.fmt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); render();
}
function onAccentChange(){
  accentOverride=document.getElementById('accentPicker').value;
  render();
}
function onBgDarken(el){
  bgDarkenVal=parseInt(el.value);
  document.getElementById('bgDarkenVal').textContent=bgDarkenVal>0?'+'+bgDarkenVal:bgDarkenVal;
  render();
}

// ── BUILD UI ─────────────────────────────────────────────
function buildThemes(){
  const grid=document.getElementById('themesGrid');
  grid.innerHTML='';
  const tagLabel={screen:'Écran',print:'Impression',both:'Écran & Print'};
  THEMES.forEach((th,i)=>{
    const wrap=document.createElement('div');
    wrap.className='theme-btn'+(i===0?' active':'');
    const tc=document.createElement('canvas'); tc.width=100; tc.height=100;
    const tctx=tc.getContext('2d');
    tctx.fillStyle=th.bg; tctx.fillRect(0,0,100,100);
    tctx.fillStyle=th.accent; tctx.fillRect(0,0,100,7); tctx.fillRect(0,0,6,100);
    tctx.fillStyle=th.text; tctx.font=`700 11px ${th.font}`; tctx.fillText(th.name,10,36);
    tctx.fillStyle=hexA(th.text,.45); tctx.font='300 7.5px DM Sans'; tctx.fillText(tagLabel[th.tag]||'',10,50);
    wrap.appendChild(tc);
    const lbl=document.createElement('div'); lbl.className='theme-label';
    lbl.innerHTML=`${th.name}<br><span class="theme-tag tag-${th.tag}">${tagLabel[th.tag]}</span>`;
    wrap.appendChild(lbl);
    wrap.onclick=()=>{
      document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
      wrap.classList.add('active');
      currentThemeIdx=i; accentOverride=null;
      document.getElementById('accentPicker').value=th.accent;
      render();
    };
    grid.appendChild(wrap);
  });
  document.getElementById('accentPicker').value=THEMES[0].accent;
}

function buildTpls(){
  const grid=document.getElementById('tplGrid');
  grid.innerHTML='';
  TEMPLATES.forEach((tpl,i)=>{
    const wrap=document.createElement('div');
    wrap.className='tpl-thumb'+(i===0?' active':'');
    const tc=document.createElement('canvas'); tc.width=200; tc.height=200;
    tpl.draw(tc.getContext('2d'),200,200,{title:'TITRE',sub:'Sous-titre',body:'Corps du texte',cta:'En savoir plus',brand:'Marque',url:'#'},THEMES[currentThemeIdx]);
    wrap.appendChild(tc);
    wrap.onclick=()=>{
      document.querySelectorAll('.tpl-thumb').forEach(b=>b.classList.remove('active'));
      wrap.classList.add('active'); currentTplIdx=i; render();
    };
    grid.appendChild(wrap);
  });
}

// ── EXPORTS ───────────────────────────────────────────────
function exportImg(type){
  const ec=document.createElement('canvas'); render(ec);
  const link=document.createElement('a');
  link.download=`flashflyer-${currentFormat}-${Date.now()}.${type}`;
  link.href=ec.toDataURL(type==='jpg'?'image/jpeg':'image/png',type==='jpg'?0.92:1);
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
function exportPrint(){
  const orig=currentFormat; currentFormat='portrait';
  const ec=document.createElement('canvas'); render(ec);
  currentFormat=orig;
  const link=document.createElement('a');
  link.download=`flashflyer-impression-A4-${Date.now()}.png`;
  link.href=ec.toDataURL('image/png',1);
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

  const ec=document.createElement('canvas'); render(ec);

// ── INIT ─────────────────────────────────────────────────
buildThemes(); buildTpls(); render();
</script>
