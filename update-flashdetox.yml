name: Mise à jour hebdomadaire FlashDetox

on:
  schedule:
    # Tous les lundis à 6h00 UTC (≈ 7h ou 8h heure de Paris selon la saison)
    - cron: '0 6 * * 1'
  workflow_dispatch: {}
    # Permet aussi de déclencher la génération manuellement depuis l'onglet
    # "Actions" du repo GitHub, sans attendre lundi — pratique pour tester.

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer le contenu de la semaine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-flashdetox.mjs

      - name: Committer les fichiers mis à jour
        run: |
          git config user.name "flashdetox-bot"
          git config user.email "actions@github.com"
          git add data/flashdetox-semaine.json data/flashdetox-tendances.json
          git diff --quiet --cached || git commit -m "FlashDetox — mise à jour hebdomadaire automatique"
          git push
